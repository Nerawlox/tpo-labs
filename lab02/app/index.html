<!DOCTYPE html><html lang="ru"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Список задач • ЛР 2</title><link rel="stylesheet" href="/shared/style.css">
<header><strong>Практикум ТПО</strong><span>Лабораторная работа 02 / Тестирование UI</span></header><main><div class="eyebrow">План на день</div><h1>Список задач</h1><p class="intro">Добавляйте задачи, отмечайте выполненные и переключайте фильтры.</p><section class="card">
<form id="todo-form"><label for="new-task">Новая задача</label><div style="display:flex;gap:12px"><input id="new-task" placeholder="Что нужно сделать?"><button id="add-task">Добавить</button></div></form>
<div class="filters"><button data-filter="all">Все</button><button data-filter="active" class="secondary">Активные</button><button data-filter="done" class="secondary">Выполненные</button></div><div id="tasks" aria-live="polite"></div><p id="counter" class="hint"></p><button id="reset" class="secondary">Сбросить список</button>
</section><footer>Учебная версия 1.0 · Данные сохраняются в текущем браузере.</footer></main><script src="app.js"></script></html>
