name: Automated tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Run unit tests
        run: python -m pytest lab06 -v --junitxml=ci-results/unit-tests.xml
      - name: Save test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: ci-results/

  ui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Run Selenium tests against own local server
        run: python -m pytest lab03 lab04 -v --junitxml=ci-results/ui-tests.xml
      - name: Save UI test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: |
            ci-results/
            lab03/screenshots/
            lab04/screenshots/
